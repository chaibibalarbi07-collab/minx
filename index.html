<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Min X</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#0a0a0a;color:#fff;
    font-family:system-ui,sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:24px;text-align:center;
  }
  .logo{
    width:140px;height:140px;
    border-radius:34px;
    background:linear-gradient(145deg,#f5c542,#a37a1a);
    display:flex;align-items:center;justify-content:center;
    font-size:56px;font-weight:900;color:#000;
    letter-spacing:-3px;
    box-shadow:0 0 80px rgba(245,197,66,.55);
    animation:pulse 2.5s infinite;
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);box-shadow:0 0 80px rgba(245,197,66,.55)}
    50%{transform:scale(1.06);box-shadow:0 0 120px rgba(245,197,66,.85)}
  }
  h1{
    font-size:44px;font-weight:900;margin-top:28px;
    background:linear-gradient(90deg,#f5c542,#fff,#f5c542);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
  }
  p{color:#8a8a8a;margin-top:12px;font-size:16px;line-height:1.7;max-width:320px}
  .badge{
    margin-top:28px;padding:8px 20px;
    background:#161616;border:1px solid #262626;
    border-radius:30px;font-size:13px;color:#f5c542;
    font-weight:700;
  }
  .hint{
    position:fixed;bottom:24px;left:24px;right:24px;
    color:#555;font-size:12px;
  }
</style>
</head>
<body>
  <div class="logo">MX</div>
  <h1>Min X</h1>
  <p>منصة التعدين والمكافآت</p>
  <div class="badge">🚀 النسخة التجريبية</div>
  <div class="hint">التطبيق يعمل الآن — جاهز للتثبيت</div>
</body>
</html>
